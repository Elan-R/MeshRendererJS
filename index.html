<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unicode Triangle Mesh Renderer</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Mono:wght@100..900&display=swap" rel="stylesheet">
    <script type="text/javascript" src="stuff/font_data.js"></script>
    <script type="text/javascript" src="stuff/cube.js"></script>
    <script type="text/javascript" src="libs/math.js"></script>
    <script type="text/javascript" src="libs/ascii.js"></script>
    <script type="text/javascript" src="libs/render.js"></script>
    <style>
        .noto-sans-mono {
            font-family: "Noto Sans Mono", monospace;
            font-optical-sizing: auto;
            font-style: normal;
            font-variation-settings: "wdth" 100;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(5, 2px);
            grid-gap: 2px;
        }
        .grid-item {
            width: 2px;
            height: 2px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 0.3rem;
        }
        .center {
            margin: 0 auto;
            width: 50%;
        }
    </style>
</head>
<body>

<div class="grid noto-sans-mono center"></div>

<script>
    function parseMesh(position, forward, up, triangleData) {
        let triangles = [];

        for (let i = 0; i < triangleData.triangles.length; i++) {
            let triangle = triangleData.triangles[i];
            let vertices = triangle.vertices;

            triangles.push(new Triangle3D(
                new Point3D(vertices[0][0], vertices[0][1], vertices[0][2]),
                new Point3D(vertices[1][0], vertices[1][1], vertices[1][2]),
                new Point3D(vertices[2][0], vertices[2][1], vertices[2][2])
            ));
        }

        return new Mesh(position, forward, up, triangles);
    }

    function objToMesh(position, forward, up, objString, scale) {
        vertices = [];
        triangles = [];

        for (const line of objString.split("\n")) {
            parts = line.split(" ").filter(part => part != "");

            switch (parts[0]) {
                case "#":
                    break;
                case "v":
                    vertices.push(new Point3D(
                        parseFloat(parts[1]) * scale,
                        parseFloat(parts[2]) * scale,
                        parseFloat(parts[3]) * scale
                    ));
                    break;
                case "f":
                    for (let i = 2; i < parts.length - 1; i++) {
                        triangles.push(new Triangle3D(
                            vertices[parseInt(parts[1].split("//")[0]) - 1],
                            vertices[parseInt(parts[i].split("//")[0]) - 1],
                            vertices[parseInt(parts[i + 1].split("//")[0]) - 1]
                        ));
                    }
                    break;
                default:
                    break;
            }
        }

        return new Mesh(position, forward, up, triangles);
    }

    function centerMesh(mesh) {
        let meanX = 0;
        let meanY = 0;
        let meanZ = 0;
        let count = 0;

        for (const triangle of mesh.triangles) {
            count += 1;
            meanX = meanX + (triangle.p1.x - meanX) / count;
            meanY = meanY + (triangle.p1.y - meanY) / count;
            meanZ = meanZ + (triangle.p1.z - meanZ) / count;
            count += 1;
            meanX = meanX + (triangle.p2.x - meanX) / count;
            meanY = meanY + (triangle.p2.y - meanY) / count;
            meanZ = meanZ + (triangle.p2.z - meanZ) / count;
            count += 1;
            meanX = meanX + (triangle.p3.x - meanX) / count;
            meanY = meanY + (triangle.p3.y - meanY) / count;
            meanZ = meanZ + (triangle.p3.z - meanZ) / count;
        }

        toOrigin = negate(new Vector3D(meanX, meanY, meanZ));
        triangles = [];

        for (const triangle of mesh.triangles) {
            triangles.push(new Triangle3D(
                shift(triangle.p1, toOrigin),
                shift(triangle.p2, toOrigin),
                shift(triangle.p3, toOrigin)
            ));
        }

        mesh.triangles = triangles;
    }

    function normalizeMesh(mesh) {
        radius = 0;

        for (const triangle of mesh.triangles) {
            let mag = 0;
            if ((mag = magnitude(triangle.p1)) > radius) radius = mag;
            if ((mag = magnitude(triangle.p2)) > radius) radius = mag;
            if ((mag = magnitude(triangle.p3)) > radius) radius = mag;
        }

        factor = 1/radius;
        triangles = [];

        for (const triangle of mesh.triangles) {
            triangles.push(new Triangle3D(
                scale(triangle.p1, factor),
                scale(triangle.p2, factor),
                scale(triangle.p3, factor)
            ));
        }

        mesh.triangles = triangles;
    }

    function createCharacterGrid(data) {
        const gridContainer = document.querySelector('.grid');
        gridContainer.replaceChildren();
        gridContainer.style["grid-template-columns"] = `repeat(${data[0].length}, 2px)`;

        for (const row of data) {
            for (const character of row) {
                const gridItem = document.createElement("div");
                gridItem.classList.add("grid-item");
                gridItem.textContent = character;
                gridContainer.appendChild(gridItem);
            }
        }
    }

    function readMesh(path, position, forward, up, callback) {
        fetch(path)
            .then((res) => res.text())
            .then((text) => {
                mesh = objToMesh(position, forward, up, text, 1);
                centerMesh(mesh);
                normalizeMesh(mesh);
                callback(mesh);
            })
            .catch((e) => console.error(e));
    }

    cameraPoint = new Point3D(3, 3, 3);
    cameraDirection = normalize(new Vector3D(-1.5, -1, -1));
    cameraUp = cross(cameraDirection, cross(Vector3D.up, new Vector3D(-0.5, 0, -1)));

    camera = new Camera(cameraPoint, cameraDirection, cameraUp, null, new Vector3D(-1, 0, -0.5));

    distanceToScreen = 3;
    width = 200;
    height = 150;
    xStep = 0.02;
    yStep = 0.02;

    renderer = new Renderer(camera, distanceToScreen, width, height, xStep, yStep, fontData);

    cubeMesh = parseMesh(Point3D.origin, Vector3D.forward, Vector3D.up, cube);

    window.addEventListener("keydown", e => {
        switch (e.key) {
            case "w":
                camera.pitch(0.1);
                break;
            case "s":
                camera.pitch(-0.1);
                break;
            case "d":
                camera.yaw(0.1);
                break;
            case "a":
                camera.yaw(-0.1);
                break;
            case "i":
                camera.shiftBy(camera.forward, 0.2);
                break;
            case "k":
                camera.shiftBy(camera.forward, -0.2);
                break;
            case "l":
                camera.roll(0.1);
                break;
            case "j":
                camera.roll(-0.1);
            default:
                break;
        }
    });

    readMesh("pumpkin.obj", new Point3D(-1, -1, 0), Vector3D.forward, Vector3D.up, pumpkin => {
        setInterval(() => {
            pumpkin.yaw(0.1);
            createCharacterGrid(renderer.generateFrame(pumpkin));
        }, 100);
    })

    // https://people.sc.fsu.edu/~jburkardt/data/obj/obj.html
</script>

</body>
</html>
