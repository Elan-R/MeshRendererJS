<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unicode Triangle Mesh Renderer</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Mono:wght@100..900&display=swap" rel="stylesheet">
    <script type="text/javascript" src="stuff/font_data.js"></script>
    <script type="text/javascript" src="stuff/cube.js"></script>
    <script type="text/javascript" src="libs/math.js"></script>
    <script type="text/javascript" src="libs/ascii.js"></script>
    <script type="text/javascript" src="libs/render.js"></script>
    <style>
        .noto-sans-mono {
            font-family: "Noto Sans Mono", monospace;
            font-optical-sizing: auto;
            font-style: normal;
            font-variation-settings: "wdth" 100;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(5, 2px);
            grid-gap: 2px;
        }
        .grid-item {
            width: 2px;
            height: 2px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 0.3rem;
        }
    </style>
</head>
<body>

<div class="grid noto-sans-mono">
    <!-- JavaScript will populate this grid -->
</div>

<script>
    function parseMesh(position, forward, up, triangleData) {
        let triangles = [];

        for (let i = 0; i < triangleData.triangles.length; i++) {
            let triangle = triangleData.triangles[i];
            let vertices = triangle.vertices;

            triangles.push(new Triangle3D(
                new Point3D(vertices[0][0], vertices[0][1], vertices[0][2]),
                new Point3D(vertices[1][0], vertices[1][1], vertices[1][2]),
                new Point3D(vertices[2][0], vertices[2][1], vertices[2][2])
            ));
        }

        return new Mesh(position, forward, up, triangles);
    }

    function createCharacterGrid(data) {
        const gridContainer = document.querySelector('.grid');
        gridContainer.replaceChildren();
        gridContainer.style["grid-template-columns"] = `repeat(${data[0].length}, 2px)`;

        for (const row of data) {
            for (const character of row) {
                const gridItem = document.createElement("div");
                gridItem.classList.add("grid-item");
                gridItem.textContent = character;
                gridContainer.appendChild(gridItem);
            }
        }
    }

    cameraPoint = new Point3D(3, 3, 3);
    cameraDirection = normalize(new Vector3D(-1.5, -1, -1));
    cameraUp = cross(cameraDirection, cross(Vector3D.up, new Vector3D(-0.5, 0, -1)));

    camera = new Camera(cameraPoint, cameraDirection, cameraUp, null, new Vector3D(-1, 0, -0.5));

    distanceToScreen = 3;
    width = 200;
    height = 150;
    xStep = 0.02;
    yStep = 0.02;

    renderer = new Renderer(camera, distanceToScreen, width, height, xStep, yStep, fontData);

    cubeMesh = parseMesh(Point3D.origin, Vector3D.forward, Vector3D.up, cube);

    setInterval(() => {
        cubeMesh.yaw(0.1);
        cubeMesh.roll(0.02);
        cubeMesh.pitch(0.08);
        createCharacterGrid(renderer.generateFrame(cubeMesh));
    }, 100);
</script>

</body>
</html>
